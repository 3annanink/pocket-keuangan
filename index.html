<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pocket Expense Tracker</title>
<meta name="description" content="A simple, private expense tracker that works offline. Your data stays on your device.">
<meta name="theme-color" content="#fff4dc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#fff4dc;--card:#fff;--ink:#1d1b3a;--mut:#5d5a78;--line:#1d1b3a;--sh:#1d1b3a;--red:#e0303a;--teal:#00857a;--yel:#ffc93c;--pur:#6c4cf1;--soft:#f6e9c9}
:root[data-theme="dark"]{--bg:#14122b;--card:#22204a;--ink:#fff4dc;--mut:#b4b0d6;--line:#4a4690;--sh:#000;--soft:#2c2a5c}
@media (prefers-color-scheme:dark){:root[data-theme="auto"]{--bg:#14122b;--card:#22204a;--ink:#fff4dc;--mut:#b4b0d6;--line:#4a4690;--sh:#000;--soft:#2c2a5c}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
#app{max-width:560px;margin:0 auto;padding:18px 16px 0}
h1{font-size:26px;font-weight:900;letter-spacing:-.02em}
h2{font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:22px 0 10px}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.top h1 span{color:var(--red)}
.card{background:var(--card);border:3px solid var(--line);border-radius:16px;box-shadow:5px 5px 0 var(--sh);padding:14px 16px}
.mnav{display:flex;align-items:center;gap:8px}
.mnav b{min-width:128px;text-align:center;font-size:16px}
.ib{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;font-weight:900;cursor:pointer}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.sum .card{padding:12px 14px}
.sum .full{grid-column:1/-1}
.lab{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.big{font-size:24px;font-weight:900;margin-top:2px;letter-spacing:-.02em;white-space:nowrap}
.big.sm{font-size:19px}
.inc{background:var(--teal);color:#fff}.exp{background:var(--red);color:#fff}.bal{background:var(--yel);color:#1d1b3a}
.inc .lab,.exp .lab,.bal .lab{color:inherit;opacity:.85}
.bars{display:flex;flex-direction:column;gap:12px}
.bar .r{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:4px;gap:8px}
.track{height:14px;border:2.5px solid var(--line);border-radius:99px;background:var(--soft);overflow:hidden}
.fill{height:100%;border-right:2.5px solid var(--line)}
.list{display:flex;flex-direction:column;gap:10px}
.tx{display:flex;align-items:center;gap:12px;padding:10px 12px;border:3px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;width:100%;text-align:left;color:var(--ink);font:inherit}
.dot{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);flex:none;display:grid;place-items:center;font-weight:900;color:#fff;font-size:15px}
.tx .m{flex:1;min-width:0}.tx .m b{display:block;font-size:15px}.tx .m small{display:block;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:900;font-size:15px;white-space:nowrap}.a.p{color:var(--teal)}.a.n{color:var(--red)}
.dg{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:12px 2px 2px}
.chips{display:flex;gap:8px;margin:6px 0 4px;flex-wrap:wrap}
.chip{border:3px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);padding:6px 14px;font-weight:800;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--yel);color:#1d1b3a}
.empty{text-align:center;padding:26px 12px;color:var(--mut);font-weight:600}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:4px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:3px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5}
.tabs>div{width:100%;max-width:560px;display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:end;gap:2px}
.tab{background:none;border:0;color:var(--mut);font-weight:800;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;font-family:inherit}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)}.tab.on svg{stroke:var(--red)}
.fab{width:62px;height:62px;margin:0 auto 4px;border-radius:50%;border:3px solid var(--line);background:var(--red);color:#fff;font-size:34px;font-weight:700;line-height:1;box-shadow:4px 4px 0 var(--sh);cursor:pointer;display:grid;place-items:center}
.ov{position:fixed;inset:0;background:rgba(20,18,43,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border:3px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{font-size:20px;font-weight:900;margin-bottom:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:3px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.seg button{border:0;padding:10px;font-weight:900;font-size:15px;background:var(--card);color:var(--ink);cursor:pointer;font-family:inherit}
.seg.three{grid-template-columns:1fr 1fr 1fr}.seg button.on.t{background:var(--yel);color:#1d1b3a}
.seg button.on.e{background:var(--red);color:#fff}.seg button.on.i{background:var(--teal);color:#fff}
label{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:12px;border:3px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:16px;font-weight:600}
input.amt{font-size:28px;font-weight:900}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;margin-top:14px;padding:14px;border:3px solid var(--line);border-radius:14px;background:var(--pur);color:#fff;font:inherit;font-size:16px;font-weight:900;box-shadow:4px 4px 0 var(--sh);cursor:pointer}
.btn.sec{background:var(--card);color:var(--ink);box-shadow:none;margin-top:10px}
.btn.del{background:var(--card);color:var(--red);box-shadow:none;margin-top:10px}
.btn.sm{width:auto;margin:0;padding:9px 14px;font-size:14px;box-shadow:3px 3px 0 var(--sh)}
.brow{display:flex;gap:10px;align-items:center}.brow .grow{flex:1;min-width:0}
.bgt{display:flex;flex-direction:column;gap:14px}
.bgt .h{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px;font-weight:800;font-size:14.5px}
.bgt input{width:110px;padding:7px 9px;font-size:15px;text-align:right}
.note{font-size:13px;color:var(--mut);font-weight:600;margin-top:6px;line-height:1.45}
.tag{display:inline-flex;align-items:center;gap:6px;border:2.5px solid var(--line);border-radius:99px;padding:4px 6px 4px 12px;font-weight:700;font-size:13.5px;margin:0 6px 8px 0;background:var(--card)}
.tag button{border:0;background:var(--soft);color:var(--ink);width:22px;height:22px;border-radius:50%;font-weight:900;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;z-index:20;max-width:90vw;text-align:center}
.stack>*+*{margin-top:12px}
@media print{.tabs,.fab{display:none}}
</style>
</head>

};

  en: { rows: [["income", 3200, 0, 1, "Paycheck"], ["income", 180, 1, 9, "Logo project"], ["expense", 1100, 3, 2, "Rent"], ["expense", 86.4, 1, 4, "Weekly shop"], ["expense", 42.5, 0, 5, "Dinner out"], ["expense", 60, 2, 6, "Gas"], ["expense", 129.99, 4, 8, "Winter jacket"], ["expense", 24, 6, 10, "Movie night"], ["expense", 72.15, 1, 12, "Costco run"], ["expense", 55, 5, 14, "Pharmacy"], ["expense", 18.7, 0, 15, "Coffee and lunch"], ["expense", 95, 3, 16, "Phone and internet"]], budgets: { 0: 150, 1: 300, 2: 120, 4: 200, 6: 100 } },

};
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function defFor(lang) {
  var d = L[lang] || L.en;
  return { tx: [], budgets: {}, cats: { expense: d.cats_exp.slice(), income: d.cats_inc.slice() }, settings: { symbol: d.symbol, theme: "auto", lang: lang } };
}
function load() {
  var lang = DEFAULT_LANG;
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var o = JSON.parse(raw);
      if (o.settings && L[o.settings.lang]) lang = o.settings.lang;
      var d = defFor(lang);
      if (Array.isArray(o.tx)) d.tx = o.tx;
      if (o.budgets && typeof o.budgets === "object") d.budgets = o.budgets;
      if (o.cats && Array.isArray(o.cats.expense) && Array.isArray(o.cats.income)) d.cats = o.cats;
      if (o.settings) d.settings = Object.assign(d.settings, o.settings);
      d.settings.lang = lang;
      return d;
    }
  } catch (e) {}
  return defFor(lang);
}
var S = load();
function lang() { return L[S.settings.lang] ? S.settings.lang : "en"; }
function t(k) {
  var s = (L[lang()][k] != null ? L[lang()][k] : L.en[k]) || k;
  for (var i = 1; i < arguments.length; i++) s = s.replace("{" + (i - 1) + "}", arguments[i]);
  return s;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast(t("save_fail")); } }

var view = "home", filter = "all";
var month = new Date(); month.setDate(1);

/* ---------- helpers ---------- */
function h(tag, attrs) {
  var el = document.createElement(tag);
  attrs = attrs || {};
  for (var k in attrs) {
    if (k === "class") el.className = attrs[k];
    else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), attrs[k]);
    else if (k === "html") el.innerHTML = attrs[k];
    else el.setAttribute(k, attrs[k]);
  }
  for (var i = 2; i < arguments.length; i++) {
    var c = arguments[i];
    if (c == null || c === false) continue;
    el.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
  }
  return el;
}
function money(n) {
  var sym = S.settings.symbol, digits = sym === "Rp" ? 0 : 2;
  var s = Math.abs(n).toLocaleString(L[lang()].locale, { minimumFractionDigits: digits, maximumFractionDigits: digits });
  return (n < 0 ? "-" : "") + sym + (sym === "Rp" ? "\u00a0" : "") + s;
}
function pad(n) { return (n < 10 ? "0" : "") + n; }
function today() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function ym(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1); }
function monthLabel() { return month.toLocaleString(L[lang()].locale, { month: "long", year: "numeric" }); }
function monthTx() { var p = ym(month); return S.tx.filter(function (x) { return x.date.slice(0, 7) === p; }); }
function colorFor(cat) {
  var all = S.cats.expense.concat(S.cats.income.filter(function (c) { return S.cats.expense.indexOf(c) < 0; }));
  var i = all.indexOf(cat); return COLORS[(i < 0 ? 0 : i) % COLORS.length];
}
function dateLabel(iso) {
  var p = iso.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2]);
  return d.toLocaleDateString(L[lang()].locale, { weekday: "short", month: "short", day: "numeric" });
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function toast(msg) {
  var old = document.querySelector(".toast"); if (old) old.remove();
  var el = h("div", { class: "toast" }, msg); document.body.appendChild(el);
  setTimeout(function () { el.remove(); }, 2400);
}
function applyTheme() { document.documentElement.setAttribute("data-theme", S.settings.theme); }
function sums(list) {
  var i = 0, e = 0; list.forEach(function (x) { if (x.type === "income") i += x.amount; else e += x.amount; });
  return { inc: i, exp: e, bal: i - e };
}
function shiftMonth(n) { month = new Date(month.getFullYear(), month.getMonth() + n, 1); render(); }
function monthNav() {
  return h("div", { class: "mnav" },
    h("button", { class: "ib", "aria-label": t("prev"), onclick: function () { shiftMonth(-1); } }, "‹"),
    h("b", {}, monthLabel()),
    h("button", { class: "ib", "aria-label": t("next"), onclick: function () { shiftMonth(1); } }, "›"));
}
function txRow(x) {
  var neg = x.type === "expense";
  return h("button", { class: "tx", onclick: function () { openTx(x); } },
    h("div", { class: "dot", style: "background:" + colorFor(x.cat) }, (x.cat || "?").charAt(0).toUpperCase()),

}
function byDateDesc(a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : (a.id < b.id ? 1 : -1); }

/* ---------- views ---------- */
function vHome() {
  var list = monthTx(), s = sums(list);
  var box = h("div", {});
